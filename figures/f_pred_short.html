on-table th {\n        background: rgba(56,189,248,0.18);\n        color: #ffffff;\n        padding: 12px;\n        text-align: left;\n        border-bottom: 1px solid rgba(255,255,255,0.18);\n        white-space: nowrap;\n    }\n\n    .prediction-table td {\n        padding: 11px 12px;\n        border-bottom: 1px solid rgba(255,255,255,0.10);\n        white-space: nowrap;\n    }\n\n    .footer-note {\n        margin-top: 28px;\n        padding-top: 18px;\n        border-top: 1px solid rgba(255,255,255,0.15);\n        text-align: center;\n        font-size: 15px;\n        color: #cbd5e1;\n        line-height: 1.8;\n    }\n\n    .footer-note strong {\n        color: #facc15;\n    }\n\n    @media (max-width: 900px) {\n\n        .analysis-wrapper {\n            padding: 18px;\n            border-radius: 16px;\n        }\n\n        .analysis-title {\n            font-size: 30px;\n            line-height: 1.3;\n        }\n\n        .analysis-subtitle {\n            font-size: 17px;\n            line-height: 1.7;\n        }\n\n        .analysis-grid {\n            grid-template-columns: 1fr;\n            gap: 18px;\n        }\n\n        .analysis-box,\n        .wide-box {\n            padding: 18px;\n        }\n\n        .analysis-box h3,\n        .wide-box h3 {\n            font-size: 24px;\n        }\n\n        .analysis-box ul,\n        .analysis-box p,\n        .wide-box p {\n            font-size: 16px;\n            line-height: 1.8;\n        }\n\n        .prediction-table {\n            font-size: 14px;\n            min-width: 680px;\n        }\n\n        .footer-note {\n            font-size: 13px;\n        }\n    }\n\n    &lt;/style&gt;\n\n    &lt;div class=\"analysis-wrapper\"&gt;\n\n        &lt;div class=\"analysis-title\"&gt;\n            \ud83d\udcca Bitcoin Cycle Prediction (Short Term)\n        &lt;/div&gt;\n\n        &lt;div class=\"analysis-subtitle\"&gt;\n\n            &lt;div style=\"\n                font-size:18px;\n                color:#93c5fd;\n                margin-bottom:14px;\n                font-weight:bold;\n            \"&gt;\n                Bitcoin price data through: 2026-07-17\n            &lt;/div&gt;\n\n            This short-term version focuses only on the current Bitcoin cycle,\n            starting from the late-2022 bottom, rising toward the current cycle\n            top, and projecting possible paths toward the next cycle bottom and\n            the following recovery.\n\n        &lt;/div&gt;\n\n        &lt;div class=\"analysis-grid\"&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;\ud83d\udd0d What the Figure Shows&lt;/h3&gt;\n                &lt;ul&gt;\n                    &lt;li&gt;Blue line: Bitcoin price.&lt;/li&gt;\n                    &lt;li&gt;Blue X: late-2022 cycle bottom.&lt;/li&gt;\n                    &lt;li&gt;Red circle: current cycle top.&lt;/li&gt;\n                    &lt;li&gt;Green arrow: upward phase from bottom to top.&lt;/li&gt;\n                    &lt;li&gt;Red dotted arrows: possible future bottom scenarios.&lt;/li&gt;\n                    &lt;li&gt;Green dotted arrows: possible recovery scenarios.&lt;/li&gt;\n                &lt;/ul&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;\ud83d\udcd8 Short-Term Focus&lt;/h3&gt;\n                &lt;p&gt;\n                    Unlike the full prediction figure, this chart zooms into the\n                    most recent cycle only. It is designed to make the current\n                    cycle structure easier to see without the earlier historical\n                    cycles compressing the figure.\n                &lt;/p&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;\ud83e\udded Prediction Logic&lt;/h3&gt;\n                &lt;ul&gt;\n                    &lt;li&gt;Start from the late-2022 bottom.&lt;/li&gt;\n                    &lt;li&gt;Follow the rise toward the current cycle top.&lt;/li&gt;\n                    &lt;li&gt;Apply historical top-to-bottom decline ratios.&lt;/li&gt;\n                    &lt;li&gt;Project possible recovery paths after the bottom.&lt;/li&gt;\n                &lt;/ul&gt;\n            &lt;/div&gt;\n\n        &lt;/div&gt;\n\n        &lt;div class=\"wide-box\"&gt;\n            &lt;h3&gt;1. Future Bottom Scenarios&lt;/h3&gt;\n            &lt;p&gt;\n                The future bottom is estimated by applying several historical\n                top-to-bottom decline ratios to the current cycle top.\n            &lt;/p&gt;\n            &lt;div class=\"table-wrapper\"&gt;\n                \n    &lt;table class=\"prediction-table\"&gt;\n        &lt;thead&gt;\n            &lt;tr&gt;\n                &lt;th&gt;Scenario&lt;/th&gt;\n                &lt;th&gt;Predicted date&lt;/th&gt;\n                &lt;th&gt;Predicted bottom&lt;/th&gt;\n                &lt;th&gt;Top / Bottom&lt;/th&gt;\n                &lt;th&gt;Annual decline&lt;/th&gt;\n            &lt;/tr&gt;\n        &lt;/thead&gt;\n        &lt;tbody&gt;\n    \n            &lt;tr&gt;\n                &lt;td&gt;Bottom 1&lt;/td&gt;\n                &lt;td&gt;2026-09-22&lt;/td&gt;\n                &lt;td&gt;$51,775&lt;/td&gt;\n                &lt;td&gt;2.41x&lt;/td&gt;\n                &lt;td&gt;-60.1%&lt;/td&gt;\n            &lt;/tr&gt;\n        \n            &lt;tr&gt;\n                &lt;td&gt;Bottom 2&lt;/td&gt;\n                &lt;td&gt;2026-09-22&lt;/td&gt;\n                &lt;td&gt;$39,362&lt;/td&gt;\n                &lt;td&gt;3.17x&lt;/td&gt;\n                &lt;td&gt;-70.0%&lt;/td&gt;\n            &lt;/tr&gt;\n        \n            &lt;tr&gt;\n                &lt;td&gt;Bottom 3&lt;/td&gt;\n                &lt;td&gt;2026-09-22&lt;/td&gt;\n                &lt;td&gt;$26,662&lt;/td&gt;\n                &lt;td&gt;4.68x&lt;/td&gt;\n                &lt;td&gt;-80.0%&lt;/td&gt;\n            &lt;/tr&gt;\n        \n        &lt;/tbody&gt;\n    &lt;/table&gt;\n    \n            &lt;/div&gt;\n        &lt;/div&gt;\n\n        &lt;div class=\"wide-box\"&gt;\n            &lt;h3&gt;2. Future Top Scenarios&lt;/h3&gt;\n            &lt;p&gt;\n                After a possible bottom is selected, the next top is projected\n                using several annual growth assumptions. These assumptions\n                reflect the diminishing-returns effect discussed in the book.\n            &lt;/p&gt;\n            &lt;div class=\"table-wrapper\"&gt;\n                \n    &lt;table class=\"prediction-table\"&gt;\n        &lt;thead&gt;\n            &lt;tr&gt;\n                &lt;th&gt;Scenario&lt;/th&gt;\n                &lt;th&gt;Predicted date&lt;/th&gt;\n                &lt;th&gt;Starting bottom&lt;/th&gt;\n                &lt;th&gt;Predicted top&lt;/th&gt;\n                &lt;th&gt;Bottom \u2192 Top&lt;/th&gt;\n                &lt;th&gt;Annual growth&lt;/th&gt;\n            &lt;/tr&gt;\n        &lt;/thead&gt;\n        &lt;tbody&gt;\n    \n            &lt;tr&gt;\n                &lt;td&gt;Top 1&lt;/td&gt;\n                &lt;td&gt;2029-06-18&lt;/td&gt;\n                &lt;td&gt;$39,362&lt;/td&gt;\n                &lt;td&gt;$340,860&lt;/td&gt;\n                &lt;td&gt;8.66x&lt;/td&gt;\n                &lt;td&gt;+120.0%&lt;/td&gt;\n            &lt;/tr&gt;\n        \n            &lt;tr&gt;\n                &lt;td&gt;Top 2&lt;/td&gt;\n                &lt;td&gt;2029-06-18&lt;/td&gt;\n                &lt;td&gt;$39,362&lt;/td&gt;\n                &lt;td&gt;$262,573&lt;/td&gt;\n                &lt;td&gt;6.67x&lt;/td&gt;\n                &lt;td&gt;+100.0%&lt;/td&gt;\n            &lt;/tr&gt;\n        \n            &lt;tr&gt;\n                &lt;td&gt;Top 3&lt;/td&gt;\n                &lt;td&gt;2029-06-18&lt;/td&gt;\n                &lt;td&gt;$39,362&lt;/td&gt;\n                &lt;td&gt;$196,776&lt;/td&gt;\n                &lt;td&gt;5.00x&lt;/td&gt;\n                &lt;td&gt;+80.0%&lt;/td&gt;\n            &lt;/tr&gt;\n        \n        &lt;/tbody&gt;\n    &lt;/table&gt;\n    \n            &lt;/div&gt;\n        &lt;/div&gt;\n\n        &lt;div class=\"footer-note\"&gt;\n            &lt;strong&gt;\u26a0 Disclaimer:&lt;/strong&gt;\n            This analysis is for educational purposes only and is not financial advice.\n            The cycle may break because of regulation, demand collapse,\n            macroeconomic shocks, technological risks, or black swan events.\n        &lt;/div&gt;\n\n    \n        &lt;style&gt;\n        .figure-share {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            gap: 14px;\n            margin: 28px auto 0 auto;\n            padding-top: 22px;\n            border-top: 1px solid rgba(255, 255, 255, 0.14);\n        }\n\n        .figure-share a {\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            width: 34px;\n            height: 34px;\n            border-radius: 50%;\n            color: white;\n            text-decoration: none;\n            transition: 0.2s;\n        }\n\n        .figure-share a:hover {\n            transform: scale(1.12);\n        }\n\n        .figure-share svg {\n            width: 18px;\n            height: 18px;\n            fill: currentColor;\n        }\n\n        .figure-share .x {\n            background: #1da1f2;\n        }\n\n        .figure-share .facebook {\n            background: #4b65a2;\n        }\n\n        .figure-share .email {\n            background: #7a7a7a;\n        }\n\n        .figure-share .whatsapp {\n            background: #25d366;\n        }\n        &lt;/style&gt;\n\n        &lt;div class=\"figure-share\" aria-label=\"Share The Cycle of Bitcoin\"&gt;\n            &lt;a class=\"x\" href=\"https://twitter.com/intent/tweet?text=Bitcoin%20Cycle%20Prediction%20%28Short%20Term%29%0AFigure%3A%20https%3A//cycbtc.com/images/f_pred_short_share.png%0AWebsite%3A%20https%3A//cycbtc.com/figures/f_pred_short.html\" ta
