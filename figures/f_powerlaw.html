","attributes":{"sizing_mode":"stretch_width","text":"\n    &lt;style&gt;\n    .analysis-wrapper {\n        width: 96%;\n        box-sizing: border-box;\n        margin: 35px auto 50px auto;\n        background: linear-gradient(135deg, #081224 0%, #0b132b 45%, #111827 100%);\n        border-radius: 22px;\n        padding: 28px;\n        color: white;\n        box-shadow: 0 10px 35px rgba(0,0,0,0.30);\n        font-family: Arial, sans-serif;\n    }\n\n    .analysis-title {\n        text-align: center;\n        font-size: 42px;\n        font-weight: 700;\n        margin-bottom: 20px;\n    }\n\n    .analysis-subtitle {\n        text-align: center;\n        font-size: 22px;\n        line-height: 1.7;\n        color: #d1d5db;\n        margin-bottom: 28px;\n    }\n\n    .analysis-subtitle strong {\n        color: #38bdf8;\n    }\n\n    .analysis-grid {\n        display: grid;\n        grid-template-columns: 1fr 1fr 1fr;\n        gap: 28px;\n        border-top: 1px solid rgba(255,255,255,0.15);\n        padding-top: 28px;\n    }\n\n    .analysis-box {\n        background: rgba(255,255,255,0.04);\n        border: 1px solid rgba(255,255,255,0.08);\n        border-radius: 18px;\n        padding: 24px;\n    }\n\n    .analysis-box h3 {\n        margin-top: 0;\n        font-size: 28px;\n        color: #38bdf8;\n    }\n\n    .analysis-box ul,\n    .analysis-box p {\n        line-height: 1.9;\n        font-size: 18px;\n        color: #e5e7eb;\n    }\n\n    .footer-note {\n        margin-top: 28px;\n        padding-top: 18px;\n        border-top: 1px solid rgba(255,255,255,0.15);\n        text-align: center;\n        font-size: 15px;\n        color: #cbd5e1;\n        line-height: 1.8;\n    }\n\n    .footer-note strong {\n        color: #facc15;\n    }\n\n    @media (max-width: 900px) {\n        .analysis-wrapper {\n            width: 100%;\n            padding: 18px;\n            border-radius: 16px;\n        }\n\n        .analysis-title {\n            font-size: 30px;\n        }\n\n        .analysis-subtitle {\n            font-size: 17px;\n        }\n\n        .analysis-grid {\n            grid-template-columns: 1fr;\n            gap: 18px;\n        }\n\n        .analysis-box h3 {\n            font-size: 24px;\n        }\n\n        .analysis-box ul,\n        .analysis-box p {\n            font-size: 16px;\n        }\n    }\n    &lt;/style&gt;\n\n    &lt;div class=\"analysis-wrapper\"&gt;\n\n        &lt;div class=\"analysis-title\"&gt;Bitcoin Power Law&lt;/div&gt;\n\n        &lt;div class=\"analysis-subtitle\"&gt;\n            This figure shows Bitcoin's long-term growth path using a\n            &lt;strong&gt;power law trend&lt;/strong&gt;. It is complementary to the Bitcoin cycle:\n            the power law describes the long-term road, while the cycle describes the\n            repeated movements above and below that road.\n        &lt;/div&gt;\n\n        &lt;div class=\"analysis-grid\"&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;\ud83d\udcca What is shown?&lt;/h3&gt;\n                &lt;ul&gt;\n                    &lt;li&gt;&lt;span style=\"color:#60a5fa;\"&gt;Blue&lt;/span&gt;: Bitcoin market price.&lt;/li&gt;\n                    &lt;li&gt;&lt;span style=\"color:#f97316;\"&gt;Orange&lt;/span&gt;: fitted power law trend.&lt;/li&gt;\n                    &lt;li&gt;&lt;span style=\"color:#22c55e;\"&gt;Green dashed&lt;/span&gt;: upper band, 2x above trend.&lt;/li&gt;\n                    &lt;li&gt;&lt;span style=\"color:#ef4444;\"&gt;Red dashed&lt;/span&gt;: lower band, 2x below trend.&lt;/li&gt;\n                    &lt;li&gt;The y-axis is logarithmic, so long-term percentage growth is easier to see.&lt;/li&gt;\n                &lt;/ul&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;\ud83d\udcc8 Why a power law?&lt;/h3&gt;\n                &lt;p&gt;\n                    Bitcoin is a growing network. In the early years, it was small, so a modest\n                    amount of new capital could create very large percentage gains.\n                &lt;/p&gt;\n                &lt;p&gt;\n                    As Bitcoin becomes larger and more mature, each additional percentage gain\n                    requires much more capital. This creates a natural slowdown in growth,\n                    which is why the long-term trend can look like a power law.\n                &lt;/p&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;\ud83d\udd01 Connection to the Bitcoin cycle&lt;/h3&gt;\n                &lt;p&gt;\n                    The Bitcoin cycle explains the repeated upward and downward phases around\n                    halvings. The power law explains the long-term direction around which these\n                    cycles move.\n                &lt;/p&gt;\n                &lt;p&gt;\n                    In this view, bull markets push Bitcoin above the long-term trend, while bear\n                    markets bring it back toward, or below, the trend.\n                &lt;/p&gt;\n            &lt;/div&gt;\n\n        &lt;/div&gt;\n\n        &lt;div class=\"analysis-grid\" style=\"margin-top: 24px;\"&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;\ud83d\ude80 Above the trend&lt;/h3&gt;\n                &lt;p&gt;\n                    When Bitcoin approaches the upper band, price is high relative to the\n                    long-term power law path.\n                &lt;/p&gt;\n                &lt;p&gt;\n                    These periods often correspond to the later stages of an upward cycle,\n                    when optimism is strong and price rises faster than the long-term trend.\n                &lt;/p&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;\ud83d\udcc9 Below the trend&lt;/h3&gt;\n                &lt;p&gt;\n                    When Bitcoin approaches the lower band, price is low relative to the\n                    long-term trend.\n                &lt;/p&gt;\n                &lt;p&gt;\n                    These periods often occur after large corrections, when market sentiment\n                    is weak and Bitcoin trades below its long-term growth path.\n                &lt;/p&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;\ud83c\udfaf Main interpretation&lt;/h3&gt;\n                &lt;p&gt;\n                    The power law and the Bitcoin cycle are not competing explanations.\n                    They answer different questions.\n                &lt;/p&gt;\n                &lt;p&gt;\n                    The power law describes the long-term growth trajectory. The Bitcoin cycle\n                    explains why the price repeatedly moves above and below that trajectory.\n                &lt;/p&gt;\n            &lt;/div&gt;\n\n        &lt;/div&gt;\n\n        &lt;div class=\"footer-note\"&gt;\n            &lt;strong&gt;Main takeaway:&lt;/strong&gt;\n            Bitcoin's long-term price appears to grow along a power-law path, while halvings\n            and market psychology create repeated cycles around that path. The power law gives\n            the broad direction; the Bitcoin cycle explains the timing of booms and corrections.\n            Together, they provide a more complete picture than either model alone.\n            &lt;br&gt;&lt;br&gt;\n            Model:\n            log10(price) = 5.504 \u00b7 log10(days) + -15.849\n            &lt;br&gt;&lt;br&gt;\n            This chart is for educational purposes only and is not financial advice.\n        &lt;/div&gt;\n\n    \n        &lt;style&gt;\n        .figure-share {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            gap: 14px;\n            margin: 28px auto 0 auto;\n            padding-top: 22px;\n            border-top: 1px solid rgba(255, 255, 255, 0.14);\n        }\n\n        .figure-share a {\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            width: 34px;\n            height: 34px;\n            border-radius: 50%;\n            color: white;\n            text-decoration: none;\n            transition: 0.2s;\n        }\n\n        .figure-share a:hover {\n            transform: scale(1.12);\n        }\n\n        .figure-share svg {\n            width: 18px;\n            height: 18px;\n            fill: currentColor;\n        }\n\n        .figure-share .x {\n            background: #1da1f2;\n        }\n\n        .figure-share .facebook {\n            background: #4b65a2;\n        }\n\n        .figure-share .email {\n            background: #7a7a7a;\n        }\n\n        .figure-share .whatsapp {\n            background: #25d366;\n        }\n        &lt;/style&gt;\n\n        &lt;div class=\"figure-share\" aria-label=\"Share The Cycle of Bitcoin\"&gt;\n            &lt;a\n                class=\"x\"\n                href=\"#\"\n                onclick=\"window.open('https://twitter.com/intent/tweet?url=' + encodeURIComponent(window.location.href) + '&amp;text=The%20Cycle%20of%20Bitcoin', '_blank', 'noopener,noreferrer'); return false;\"\n                target=\"_blank\"\n                rel=\"noopener noreferrer\"\n                aria-label=\"Share on X\"\n                title=\"Share on X\"\n            &gt;\n                &lt;svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"&gt;\n                    &lt;path d=\"M17.5 3h3.1l-6.8 7.8L22 21h-6.4l-5-6.5L4.9 21H1.8l7.3-8.4L1.2 3h6.6l4.5 5.9L17.5 3Zm-1.1 16.2h1.7L6.9 4.7H5.1l11.3 14.5Z\"/&gt;\n                &lt;/svg&gt;\n            &lt;/a&gt;\n\n            &lt;a\n                class=\"facebook\"\n                href=\"#\"\n                onclick=\"window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(window.location.href), '_blank', 'noopener,noreferrer'); return false;\"\n                target=\"_blank\"\n                rel=\"noopener noreferrer\"\n                aria-label=\"Share on Facebook\"\n                title=\"Share on Facebook\"\n            &gt;\n                &lt;svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"&gt;\n                    &lt;path d=\"M14.2 8.4V6.9c0-.7.5-.9.8-.9h2V3h-2.8c-3.1 0-3.8 2.3-3.8 3.8v1.6H8v3.2h2.4V21h3.8v-9.4h2.7l.4-3.2h-3.1Z\"/&gt;\n                &lt;/svg&gt;\n            &lt;/a&gt;\n\n            &lt;a\n                class=\"email\"\n                href=\"#\"\n                onclick=\"window.location.href = 'mailto:?subject=The%20Cycle%20of%20Bitcoin&amp;body=' + encodeURIComponent(window.location.href); return false;\"\n                aria-label=\"Share by email\"\n                title=\"Share by email\"\n            &gt;\n                &lt;svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"&gt;\n                    &lt;path d=\"M3 5h18v14H3V5Zm9 8.3L5.4 7H4.8v.7l7.2 6.9 7.2-6.9V7h-.6L12 13.3Z\"/&gt;\n                &lt;/svg&gt;\n            &lt;/a&gt;\n\n            &lt;a\n                class=\"whatsapp\"\n                href=\"#\"\n                onclick=\"window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent('The Cycle of Bitcoin ' + window.location.href), '_blank', 'noopener,noreferrer'); return false;\"\n                target=\"_blank\"\n                rel=\"noopener noreferrer\"\n                aria-label=\"Share on WhatsApp\"\n                title=\"Share on WhatsApp\"\n            &gt;\n                &lt;svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"&gt;\n                    &lt;path d=\"M12 2.2A9.7 9.7 0 0 0 3.7 17l-1.2 4.8 4.9-1.2A9.7 9.7 0 1 0 12 2.2Zm0 17.6a7.9 7.9 0 0 1-4-1.1l-.3-.2-2.9.7.8-2.8-.2-.3A7.9 7.9 0 1 1 12 19.8Zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1-.2.3-.7.8-.8 1-.2.2-.3.2-.6.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.7-1.7c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.7 2.7 4.2 3.7.6.3 1 .4 1.4.5.6.2 1.1.2 1.5.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3Z\"/&gt;\n                &lt;/svg&gt;\n            &lt;/a&gt;\n        &lt;/div&gt;\n        &lt;/div&gt;\n    "}}]}}],"callbacks":{"type":"map"}}}
