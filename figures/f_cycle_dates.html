x;\n    }\n\n    .analysis-table th {\n        background: rgba(56,189,248,0.22);\n        color: #e0f2fe;\n        padding: 12px;\n        border: 1px solid rgba(255,255,255,0.22);\n    }\n\n    .analysis-table td {\n        padding: 11px;\n        text-align: center;\n        color: #e5e7eb;\n        border: 1px solid rgba(255,255,255,0.18);\n        background: rgba(255,255,255,0.035);\n    }\n\n    .analysis-grid {\n        display: grid;\n        grid-template-columns: 1fr 1fr 1fr;\n        gap: 24px;\n        border-top: 1px solid rgba(255,255,255,0.15);\n        padding-top: 26px;\n    }\n\n    .analysis-box {\n        background: rgba(255,255,255,0.045);\n        border: 1px solid rgba(255,255,255,0.09);\n        border-radius: 18px;\n        padding: 24px;\n    }\n\n    .analysis-box h3 {\n        margin-top: 0;\n        font-size: 27px;\n        color: #38bdf8;\n    }\n\n    .analysis-box ul,\n    .analysis-box p {\n        line-height: 1.85;\n        font-size: 18px;\n        color: #e5e7eb;\n    }\n\n    .footer-note {\n        margin-top: 28px;\n        padding-top: 18px;\n        border-top: 1px solid rgba(255,255,255,0.15);\n        text-align: center;\n        font-size: 15px;\n        color: #cbd5e1;\n        line-height: 1.8;\n    }\n\n    @media (max-width: 900px) {\n        .analysis-wrapper {\n            width: 100%;\n            padding: 18px;\n            border-radius: 16px;\n        }\n\n        .analysis-title {\n            font-size: 30px;\n        }\n\n        .analysis-subtitle {\n            font-size: 17px;\n        }\n\n        .analysis-grid {\n            grid-template-columns: 1fr;\n            gap: 18px;\n        }\n\n        .analysis-box h3 {\n            font-size: 24px;\n        }\n\n        .analysis-box ul,\n        .analysis-box p {\n            font-size: 16px;\n        }\n\n        .analysis-table {\n            font-size: 13px;\n        }\n\n        .analysis-table th,\n        .analysis-table td {\n            padding: 7px;\n        }\n    }\n    &lt;/style&gt;\n\n    &lt;div class=\"analysis-wrapper\"&gt;\n        &lt;div class=\"analysis-title\"&gt;Bitcoin Cycle Dates&lt;/div&gt;\n\n        &lt;div class=\"analysis-subtitle\"&gt;\n            Bitcoin is often described as having a &lt;strong&gt;four-year cycle&lt;/strong&gt;,\n            but this is only an approximation. The cycle is driven by the halving mechanism,\n            which occurs every &lt;strong&gt;210,000 blocks&lt;/strong&gt;, not every four calendar years.\n        &lt;/div&gt;\n\n        &lt;table class=\"analysis-table\"&gt;\n            &lt;tr&gt;\n                &lt;th&gt;Halving&lt;/th&gt;\n                &lt;th&gt;Date&lt;/th&gt;\n                &lt;th&gt;Days since previous&lt;/th&gt;\n                &lt;th&gt;Elapsed time&lt;/th&gt;\n            &lt;/tr&gt;\n            &lt;tr&gt;\n                &lt;td&gt;1&lt;/td&gt;\n                &lt;td&gt;2012-11-28&lt;/td&gt;\n                &lt;td&gt;--&lt;/td&gt;\n                &lt;td&gt;--&lt;/td&gt;\n            &lt;/tr&gt;\n            &lt;tr&gt;\n                &lt;td&gt;2&lt;/td&gt;\n                &lt;td&gt;2016-07-09&lt;/td&gt;\n                &lt;td&gt;1319&lt;/td&gt;\n                &lt;td&gt;3 years, 7 months, 11 days&lt;/td&gt;\n            &lt;/tr&gt;\n            &lt;tr&gt;\n                &lt;td&gt;3&lt;/td&gt;\n                &lt;td&gt;2020-05-11&lt;/td&gt;\n                &lt;td&gt;1402&lt;/td&gt;\n                &lt;td&gt;3 years, 10 months, 2 days&lt;/td&gt;\n            &lt;/tr&gt;\n            &lt;tr&gt;\n                &lt;td&gt;4&lt;/td&gt;\n                &lt;td&gt;2024-04-20&lt;/td&gt;\n                &lt;td&gt;1440&lt;/td&gt;\n                &lt;td&gt;3 years, 11 months, 9 days&lt;/td&gt;\n            &lt;/tr&gt;\n            &lt;tr&gt;\n                &lt;td&gt;5, predicted&lt;/td&gt;\n                &lt;td&gt;2028-03-31&lt;/td&gt;\n                &lt;td&gt;1441&lt;/td&gt;\n                &lt;td&gt;3 years, 11 months, 11 days&lt;/td&gt;\n            &lt;/tr&gt;\n        &lt;/table&gt;\n\n        &lt;div class=\"analysis-grid\"&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;What is shown?&lt;/h3&gt;\n                &lt;ul&gt;\n                    &lt;li&gt;Blue line: Bitcoin price on a log scale&lt;/li&gt;\n                    &lt;li&gt;Red vertical lines: halving dates&lt;/li&gt;\n                    &lt;li&gt;Dashed red lines: mid-halving dates&lt;/li&gt;\n                    &lt;li&gt;Red dots: cycle tops&lt;/li&gt;\n                    &lt;li&gt;Blue x marks: cycle bottoms&lt;/li&gt;\n                &lt;/ul&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;Main idea&lt;/h3&gt;\n                &lt;p&gt;\n                    The phrase \u201cfour-year cycle\u201d can be misleading.\n                    The observed cycle is usually slightly shorter than four years,\n                    often closer to &lt;strong&gt;3 years and 11 months&lt;/strong&gt;.\n                    This helps explain why tops and bottoms may appear earlier than a strict\n                    calendar-year interpretation would suggest.\n                &lt;/p&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;Method&lt;/h3&gt;\n                &lt;p&gt;\n                    Cycle maxima are calculated as in the original code:\n                    within each halving period, the maximum is searched only up to\n                    &lt;strong&gt;60 days before the next halving&lt;/strong&gt;.\n                    The arrows connect cycle tops to bottoms and bottoms to the next tops.\n                &lt;/p&gt;\n            &lt;/div&gt;\n\n        &lt;/div&gt;\n\n        &lt;div class=\"footer-note\"&gt;\n            Blocks are found randomly, with an average target of about 10 minutes.\n            When blocks arrive slightly faster, 210,000 blocks are completed before four full calendar years.\n            This chart is for educational purposes only and is not financial advice.\n        &lt;/div&gt;\n    \n        &lt;style&gt;\n        .figure-share {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            gap: 14px;\n            margin: 28px auto 0 auto;\n            padding-top: 22px;\n            border-top: 1px solid rgba(255, 255, 255, 0.14);\n        }\n\n        .figure-share a {\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            width: 34px;\n            height: 34px;\n            border-radius: 50%;\n            color: white;\n            text-decoration: none;\n            transition: 0.2s;\n        }\n\n        .figure-share a:hover {\n            transform: scale(1.12);\n        }\n\n        .figure-share svg {\n            width: 18px;\n            height: 18px;\n            fill: currentColor;\n        }\n\n        .figure-share .x {\n            background: #1da1f2;\n        }\n\n        .figure-share .facebook {\n            background: #4b65a2;\n        }\n\n        .figure-share .email {\n            background: #7a7a7a;\n        }\n\n        .figure-share .whatsapp {\n            background: #25d366;\n        }\n        &lt;/style&gt;\n\n        &lt;div class=\"figure-share\" aria-label=\"Share The Cycle of Bitcoin\"&gt;\n            &lt;a\n                class=\"x\"\n                href=\"#\"\n                onclick=\"window.open('https://twitter.com/intent/tweet?url=' + encodeURIComponent(window.location.href) + '&amp;text=The%20Cycle%20of%20Bitcoin', '_blank', 'noopener,noreferrer'); return false;\"\n                target=\"_blank\"\n                rel=\"noopener noreferrer\"\n                aria-label=\"Share on X\"\n                title=\"Share on X\"\n            &gt;\n                &lt;svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"&gt;\n         &lt;svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"&gt;\n                    &lt;path d=\"M12 2.2A9.7 9.7 0 0 0 3.7 17l-1.2 4.8 4.9-1.2A9.7 9.7 0 1 0 12 2.2Zm0 17.6a7.9 7.9 0 0 1-4-1.1l-.3-.2-2.9.7.8-2.8-.2-.3A7.9 7.9 0 1 1 12 19.8Zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1-.2.3-.7.8-.8 1-.2.2-.3.2-.6.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.7-1.7c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.7 2.7 4.2 3.7.6.3 1 .4 1.4.5.6.2 1.1.2 1.5.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3Z\"/&gt;\n                &lt;/svg&gt;\n            &lt;/a&gt;\n        &lt;/div&gt;\n        &lt;/div&gt;\n    "}}]}}]}}
