{\n        text-align: center;\n        font-size: 22px;\n        line-height: 1.7;\n        color: #d1d5db;\n        margin-bottom: 28px;\n    }\n\n    .analysis-subtitle strong {\n        color: #38bdf8;\n    }\n\n    .analysis-grid {\n        display: grid;\n        grid-template-columns: 1fr 1fr 1fr;\n        gap: 28px;\n        border-top: 1px solid rgba(255,255,255,0.15);\n        padding-top: 28px;\n    }\n\n    .analysis-box {\n        background: rgba(255,255,255,0.04);\n        border: 1px solid rgba(255,255,255,0.08);\n        border-radius: 18px;\n        padding: 24px;\n    }\n\n    .analysis-box h3 {\n        margin-top: 0;\n        font-size: 28px;\n        color: #38bdf8;\n    }\n\n    .analysis-box ul,\n    .analysis-box p {\n        line-height: 1.9;\n        font-size: 18px;\n        color: #e5e7eb;\n    }\n\n    .footer-note {\n        margin-top: 28px;\n        padding-top: 18px;\n        border-top: 1px solid rgba(255,255,255,0.15);\n        text-align: center;\n        font-size: 15px;\n        color: #cbd5e1;\n        line-height: 1.8;\n    }\n\n    .footer-note strong {\n        color: #facc15;\n    }\n\n    @media (max-width: 900px) {\n        .analysis-wrapper {\n            width: 100%;\n            padding: 18px;\n            border-radius: 16px;\n        }\n\n        .analysis-title {\n            font-size: 30px;\n        }\n\n        .analysis-subtitle {\n            font-size: 17px;\n        }\n\n        .analysis-grid {\n            grid-template-columns: 1fr;\n            gap: 18px;\n        }\n\n        .analysis-box h3 {\n            font-size: 24px;\n        }\n\n        .analysis-box ul,\n        .analysis-box p {\n            font-size: 16px;\n        }\n    }\n    &lt;/style&gt;\n\n    &lt;div class=\"analysis-wrapper\"&gt;\n        &lt;div class=\"analysis-title\"&gt;?? Bitcoin Downward Periods&lt;/div&gt;\n\n        &lt;div class=\"analysis-subtitle\"&gt;\n            This page studies the &lt;strong&gt;cycle top to cycle bottom&lt;/strong&gt; phase.\n            The goal is to see whether Bitcoin bear markets behave like one continuous fall,\n            or whether they contain repeated internal waves.\n        &lt;/div&gt;\n\n        &lt;div class=\"analysis-grid\"&gt;\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;?? What is shown?&lt;/h3&gt;\n                &lt;ul&gt;\n                    &lt;li&gt;Figure 1 compares all downward periods on one normalized scale.&lt;/li&gt;\n                    &lt;li&gt;Each cycle top is set to 100.&lt;/li&gt;\n                    &lt;li&gt;Dashed lines mark completed cycle bottoms.&lt;/li&gt;\n                    &lt;li&gt;Figure 2 separates cycles and smooths the data.&lt;/li&gt;\n                &lt;/ul&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;?? Decline batches&lt;/h3&gt;\n                &lt;p&gt;\n                    The red numbered segments mark sustained decreases in the smoothed curve.\n                    They show that bear markets often move in several waves rather than in one clean drop.\n                &lt;/p&gt;\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;?? Interpretation&lt;/h3&gt;\n                &lt;p&gt;\n                    Relief rallies can happen before the final low. A rebound during a downward period\n                    does not necessarily mean the cycle has already bottomed.\n                &lt;/p&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n\n        &lt;div class=\"footer-note\"&gt;\n            &lt;strong&gt;Main takeaway:&lt;/strong&gt;\n            Bitcoin downward periods have historically contained repeated selling waves separated by rebounds.\n            This chart is for educational purposes only and is not financial advice.\n        &lt;/div&gt;\n    \n        &lt;style&gt;\n        .figure-share {\n            display: flex;\n            justify
