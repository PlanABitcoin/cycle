idth: 900px) {\n        .analysis-wrapper { width: 100%; padding: 18px; border-radius: 16px; }\n        .analysis-title { font-size: 30px; }\n        .analysis-subtitle { font-size: 17px; }\n        .analysis-grid { grid-template-columns: 1fr; gap: 18px; }\n        .analysis-box h3 { font-size: 24px; }\n        .analysis-box ul, .analysis-box p { font-size: 16px; }\n    }\n    &lt;/style&gt;\n\n    &lt;div class=\"analysis-wrapper\"&gt;\n        &lt;div class=\"analysis-title\"&gt;Bitcoin Downward Periods&lt;/div&gt;\n        &lt;div class=\"analysis-subtitle\"&gt;\n            This interactive page studies the &lt;strong&gt;cycle top to cycle bottom&lt;/strong&gt; phase.\n            It compares normalized bear-market paths and highlights major decrease batches.\n        &lt;/div&gt;\n        &lt;div class=\"analysis-grid\"&gt;\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;What the figures show&lt;/h3&gt;\n                &lt;ul&gt;\n                    &lt;li&gt;Each cycle top is normalized to 100.&lt;/li&gt;\n                    &lt;li&gt;Figure 1 compares all downward periods together.&lt;/li&gt;\n                    &lt;li&gt;Figure 2 separates cycles and applies a 28-day smooth.&lt;/li&gt;\n                    &lt;li&gt;Red segments mark sustained decrease batches.&lt;/li&gt;\n                &lt;/ul&gt;\n            &lt;/div&gt;\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;Bear-market waves&lt;/h3&gt;\n                &lt;p&gt;\n                    Downward periods are not one smooth fall. They tend to move through repeated\n                    waves of selling, temporary stabilization, and renewed decline.\n                &lt;/p&gt;\n            &lt;/div&gt;\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;How to read it&lt;/h3&gt;\n                &lt;p&gt;\n                    A rebound inside a downward period does not prove that the cycle has bottomed.\n                    Historically, relief rallies often occurred before the final low.\n                &lt;/p&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n        &lt;div class=\"footer-note\"&gt;\n            &lt;strong&gt;Main takeaway:&lt;/strong&gt; Bitcoin bear markets have historically contained recurring\n            internal decline waves. This chart is educational and is not financial advice.\n        &lt;/div&gt;\n    \n        &lt;style&gt;\n        .figure-share {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            gap: 14px;\n            margin: 28px auto 0 auto;\n            padding-top: 22px;\n            border-top: 1px solid rgba(255, 255, 255, 0.14);\n        }\n\n        .figure-share a {\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            width: 34px;\n            height: 34px;\n            border-radius: 50%;\n            color: white;\n            text-decoration: none;\n            transition: 0.2s;\n        }\n\n        .figure-share a:hover {\n            transform: scale(1.12);\n        }\n\n        .figure-share svg {\n            width: 18px;\n            height: 18px;\n            fill: currentColor;\n        }\n\n        .figure-share .x {\n            background: #1da1f2;\n        }\n\n        .figure-share .facebook {\n            background: #4b65a2;\n        }\n\n        .figure-share .email {\n            background: #7a7a7a;\n        }\n\n        .figure-share .whatsapp {\n            background: #25d366;\n        }\n        &lt;/style&gt;\n\n        &lt;div class=\"figure-share\" aria-label=\"Share The Cycle of Bitcoin\"&gt;\n            &lt;a\n                class=\"x\"\n                href=\"https://cycbtc.com\"\n                onclick=\"const pageUrl=(document.querySelector(&amp;quot;meta[property='og:url']&amp;quot;)||{}).content||window.location.href; const title=(document.querySelector(&amp;quot;meta[p
