yle&gt;\n    .analysis-wrapper {\n        width: 96%;\n        box-sizing: border-box;\n        margin: 35px auto 50px auto;\n        background: linear-gradient(135deg, #081224 0%, #0b132b 45%, #111827 100%);\n        border-radius: 22px;\n        padding: 28px;\n        color: white;\n        box-shadow: 0 10px 35px rgba(0,0,0,0.30);\n    }\n    .analysis-title {\n        text-align: center;\n        font-size: 42px;\n        font-weight: 700;\n        margin-bottom: 20px;\n    }\n    .analysis-subtitle {\n        text-align: center;\n        font-size: 28px;\n        line-height: 1.7;\n        color: #d1d5db;\n        margin-bottom: 28px;\n    }\n    .analysis-subtitle strong { color: #38bdf8; }\n    .analysis-grid {\n        display: grid;\n        grid-template-columns: 1fr 1fr 1fr;\n        gap: 28px;\n        border-top: 1px solid rgba(255,255,255,0.15);\n        padding-top: 28px;\n    }\n    .analysis-box {\n        background: rgba(255,255,255,0.04);\n        border: 1px solid rgba(255,255,255,0.08);\n        border-radius: 18px;\n        padding: 24px;\n    }\n    .analysis-box h3 {\n        margin-top: 0;\n        font-size: 28px;\n        color: #38bdf8;\n    }\n    .analysis-box ul,\n    .analysis-box p {\n        line-height: 1.9;\n        font-size: 18px;\n        color: #e5e7eb;\n    }\n    .footer-note {\n        margin-top: 28px;\n        padding-top: 18px;\n        border-top: 1px solid rgba(255,255,255,0.15);\n        text-align: center;\n        font-size: 15px;\n        color: #cbd5e1;\n        line-height: 1.8;\n    }\n    .footer-note strong { color: #facc15; }\n    @media (max-width: 900px) {\n        .analysis-wrapper { width: 100%; padding: 18px; border-radius: 16px; }\n        .analysis-title { font-size: 30px; }\n        .analysis-subtitle { font-size: 17px; }\n        .analysis-grid { grid-template-columns: 1fr; gap: 18px; }\n        .analysis-box h3 { font-size: 24px; }\n        .analysis-box ul, .analysis-box p { font-size: 16px; }\n    }\n    &lt;/style&gt;\n\n    &lt;div class=\"analysis-wrapper\"&gt;\n        &lt;div class=\"analysis-title\"&gt;Bitcoin Upward Periods&lt;/div&gt;\n        &lt;div class=\"analysis-subtitle\"&gt;\n            This interactive page studies the &lt;strong&gt;cycle bottom to cycle top&lt;/strong&gt; phase.\n            It compares normalized bull-market paths and highlights major increase batches.\n        &lt;/div&gt;\n        &lt;div class=\"analysis-grid\"&gt;\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;What the figures show&lt;/h3&gt;\n                &lt;ul&gt;\n                    &lt;li&gt;Each cycle bottom is normalized to 1x.&lt;/li&gt;\n                    &lt;li&gt;Figure 1 compares all upward periods together.&lt;/li&gt;\n                    &lt;li&gt;Figure 2 separates cycles and applies a 100-day smooth.&lt;/li&gt;\n                    &lt;li&gt;Green segments mark sustained increase batches.&lt;/li&gt;\n                &lt;/ul&gt;\n            &lt;/div&gt;\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;Bull-market waves&lt;/h3&gt;\n                &lt;p&gt;\n                    Upward periods are not one smooth rise. They tend to move through repeated\n                    waves of acceleration, consolidation, and renewed advance.\n                &lt;/p&gt;\n            &lt;/div&gt;\n            &lt;div class=\"analysis-box\"&gt;\n                &lt;h3&gt;How to read it&lt;/h3&gt;\n                &lt;p&gt;\n                    A pullback inside an upward period does not prove that the cycle has ended.\n                    Historically, major advances often included pauses before the final high.\n                &lt;/p&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n        &lt;div class=\"footer-note\"&gt;\n            &lt;strong&gt;Main takeaway:&lt;/strong&gt; Bitcoin bull markets have historically contained recurring\n            internal advance waves. This chart is educational and is not financial advice.\n        &lt;/div&gt;\n    \n        &lt;style&gt;\n        .figure-share {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            gap: 14px;\n            margin: 28px auto 0 auto;\n            padding-top: 22px;\n            border-top: 1px solid rgba(255, 255, 255, 0.14);\n        }\n\n        .figure-share a {\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            width: 34px;\n            height: 34px;\n            border-radius: 50%;\n            color: white;\n            text-decoration: none;\n            transition: 0.2s;\n        }\n\n        .figure-share a:hover {\n            transform: scale(1.12);\n        }\n\n        .figure-share svg {\n            width: 18px;\n            height: 18px;\n            fill: currentColor;\n        }\n\n        .figure-share .x {\n            background: #1da1f2;\n        }\n\n        .figure-share .facebook {\n            background: #4b65a2;\n        }\n\n        .figure-share .email {\n            background: #7a7a7a;\n        }\n\n        .figure-share .whatsapp {\n            background: #25d366;\n        }\n        &lt;/style&gt;\n\n        &lt;div class=\"figure-share\" aria-label=\"Share The Cycle of Bitcoin\"&gt;\n            &lt;a\n                class=\"x\"\n                href=\"https://cycbtc.com\"\n                onclick=\"const pageUrl=(document.querySelector(&amp;quot;meta[property='og:url']&amp;quot;)||{}).content||window.location.href; const title=(document.querySelector(&amp;quot;meta[property='og:title']&amp;quot;)||{}).content||'The Cycle of Bitcoin'; const imageUrl=(document.querySelector(&amp;quot;meta[property='og:image']&amp;quot;)||{}).content||''; const message=imageUrl ? title + '\nFigure: ' + imageUrl + '\nWebsite: ' + pageUrl : title + '\n' + pageUrl; window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(message), '_bl
