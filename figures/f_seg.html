attributes":{"sizing_mode":"stretch_width","text":"\n        &lt;style&gt;\n        .analysis-wrapper {\n            width: 96%;\n            box-sizing: border-box;\n            margin: 35px auto 50px auto;\n            background: linear-gradient(135deg, #081224 0%, #0b132b 45%, #111827 100%);\n            border-radius: 22px;\n            padding: 28px;\n            color: white;\n            box-shadow: 0 10px 35px rgba(0,0,0,0.30);\n        }\n\n        .analysis-title {\n            text-align: center;\n            font-size: 42px;\n            font-weight: 700;\n            margin-bottom: 20px;\n        }\n\n        .analysis-subtitle {\n            text-align: center;\n            font-size: 22px;\n            line-height: 1.7;\n            color: #d1d5db;\n            margin-bottom: 28px;\n        }\n\n        .analysis-subtitle strong {\n            color: #38bdf8;\n        }\n\n        .analysis-grid {\n            display: grid;\n            grid-template-columns: 1fr 1fr 1fr;\n            gap: 28px;\n            border-top: 1px solid rgba(255,255,255,0.15);\n            padding-top: 28px;\n        }\n\n        .analysis-box {\n            background: rgba(255,255,255,0.04);\n            border: 1px solid rgba(255,255,255,0.08);\n            border-radius: 18px;\n            padding: 24px;\n        }\n\n        .analysis-box h3 {\n            margin-top: 0;\n            font-size: 28px;\n            color: #38bdf8;\n        }\n\n        .analysis-box ul,\n        .analysis-box p {\n            line-height: 1.9;\n            font-size: 18px;\n            color: #e5e7eb;\n        }\n\n        .footer-note {\n            margin-top: 28px;\n            padding-top: 18px;\n            border-top: 1px solid rgba(255,255,255,0.15);\n            text-align: center;\n            font-size: 15px;\n            color: #cbd5e1;\n            line-height: 1.8;\n        }\n\n        .footer-note strong {\n            color: #facc15;\n        }\n\n        @media (max-width: 900px) {\n            .analysis-wrapper {\n                width: 100%;\n                padding: 18px;\n                border-radius: 16px;\n            }\n\n            .analysis-title {\n                font-size: 30px;\n            }\n\n            .analysis-subtitle {\n                font-size: 17px;\n            }\n\n            .analysis-grid {\n                grid-template-columns: 1fr;\n                gap: 18px;\n            }\n\n            .analysis-box h3 {\n                font-size: 24px;\n            }\n\n            .analysis-box ul,\n            .analysis-box p {\n                font-size: 16px;\n            }\n        }\n        &lt;/style&gt;\n\n        &lt;div class=\"analysis-wrapper\"&gt;\n\n            &lt;div class=\"analysis-title\"&gt;\ud83d\udd25 Cycle Segments&lt;/div&gt;\n\n            &lt;div class=\"analysis-subtitle\"&gt;\n                This heatmap divides each Bitcoin halving cycle into\n                &lt;strong&gt;8 equal block segments&lt;/strong&gt;\n                and shows the return in each segment. The goal is to see whether\n                Bitcoin returns are random, or whether they follow a repeating cycle structure.\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-grid\"&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\ud83d\udcca What is shown?&lt;/h3&gt;\n                    &lt;ul&gt;\n                        &lt;li&gt;Each row represents one Bitcoin halving cycle.&lt;/li&gt;\n                        &lt;li&gt;Each column represents one equal block segment.&lt;/li&gt;\n                        &lt;li&gt;Green cells indicate positive returns.&lt;/li&gt;\n                        &lt;li&gt;Red cells indicate negative returns.&lt;/li&gt;\n                        &lt;li&gt;Darker colors indicate stronger moves.&lt;/li&gt;\n                        &lt;li&gt;Current block in cycle: &lt;strong&gt;137,595&lt;/strong&gt;.&lt;/li&gt;\n                    &lt;/ul&gt;\n                &lt;/div&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\ud83d\udd01 Evidence for a cycle&lt;/h3&gt;\n                    &lt;p&gt;\n                        If Bitcoin returns were completely random, the green and red cells\n                        would appear scattered without a clear structure.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        Instead, the heatmap shows that similar parts of different cycles\n                        often behave in similar ways. This repeating structure is visual\n                        evidence that Bitcoin has followed a cycle tied to the halving period.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\ud83d\udcc8 Upward and downward phases&lt;/h3&gt;\n                    &lt;p&gt;\n                        The heatmap shows that Bitcoin cycles are not symmetric.\n                        Historically, much of the cycle is positive, while the correction\n                        phase is shorter and more concentrated.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        A typical pattern is a long upward phase followed by a shorter\n                        downward phase. This matches the idea that Bitcoin often rises for\n                        several segments and then corrects sharply.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-grid\" style=\"margin-top: 24px;\"&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\u26cf Why the upward phase?&lt;/h3&gt;\n                    &lt;p&gt;\n                        Every 210,000 blocks, the mining reward is cut in half.\n                        This reduces the amount of newly created Bitcoin entering the market.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        If demand remains strong, this reduction in new supply creates\n                        upward pressure on price. The repeated green regions in the heatmap\n                        are consistent with this halving-driven supply effect.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\u26a1 Why the correction?&lt;/h3&gt;\n                    &lt;p&gt;\n                        As Bitcoin price rises, mining becomes more profitable.\n                        This attracts additional miners and increases spending on electricity,\n                        hardware, cooling and infrastructure.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        Eventually mining costs can become extremely large. When these costs\n                        become difficult to sustain, they may contribute to the end of the\n                        upward phase and the beginning of the correction phase.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\ud83c\udfaf Main observation&lt;/h3&gt;\n                    &lt;p&gt;\n                        The important point is not one single cell, but the repeated pattern\n                        across cycles.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        The heatmap suggests that Bitcoin's strongest returns tend to cluster\n                        in similar parts of the halving cycle, while negative returns also\n                        tend to appear in similar parts of the cycle.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n            &lt;/div&gt;\n\n            &lt;div class=\"footer-note\"&gt;\n                &lt;strong&gt;Main takeaway:&lt;/strong&gt;\n                Across multiple halving periods, Bitcoin cycles show a surprisingly similar\n                internal structure. Positive and negative returns are not evenly scattered;\n                they tend to cluster in recurring parts of the 210,000 block cycle.\n                This supports the view that Bitcoin's long-term behavior is influenced by\n                the halving schedule and by the economic interaction between reduced supply\n                and rising mining costs.\n                &lt;br&gt;&lt;br&gt;\n                This chart is for educational purposes only and is not financial advice.\n            &lt;/div&gt;\n\n        \n        &lt;style&gt;\n        .figure-share {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            gap: 14px;\n            margin: 28px auto 0 auto;\n            padding-top: 22px;\n            border-top: 1px solid rgba(255, 255, 255, 0.14);\n        }\n\n        .figure-share a {\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            width: 34px;\n            height: 34px;\n            border-radius: 50%;\n            color: white;\n            text-decoration: none;\n            transition: 0.2s;\n        }\n\n        .figure-share a:hover {\n            transform: scale(1.12);\n        }\n\n        .figure-share svg {\n            width: 18px;\n            height: 18px;\n            fill: currentColor;\n        }\n\n        .figure-share .x {\n            background: #1da1f2;\n        }\n\n        .figure-share .facebook {\n            background: #4b65a2;\n        }\n\n        .figure-share .email {\n            background: #7a7a7a;\n        }\n\n        .figure-share .whatsapp {\n            background: #25d366;\n        }\n        &lt;/style&gt;\n\n        &lt;div class=\"figure-share\" aria-label=\"Share The Cycle of Bitcoin\"&gt;\n            &lt;a\n                class=\"x\"\n                href=\"https://cycb ul,\n        .analysis-box p {\n            line-height: 1.9;\n            font-size: 18px;\n            color: #e5e7eb;\n        }\n\n        .footer-note {\n            margin-top: 28px;\n            padding-top: 18px;\n            border-top: 1px solid rgba(255,255,255,0.15);\n            text-align: center;\n            font-size: 15px;\n            color: #cbd5e1;\n            line-height: 1.8;\n        }\n\n        .footer-note strong {\n            color: #facc15;\n        }\n\n        @media (max-width: 900px) {\n            .analysis-wrapper {\n                width: 100%;\n                padding: 18px;\n                border-radius: 16px;\n            }\n\n            .analysis-title {\n                font-size: 30px;\n            }\n\n            .analysis-subtitle {\n                font-size: 17px;\n            }\n\n            .analysis-grid {\n                grid-template-columns: 1fr;\n                gap: 18px;\n            }\n\n            .analysis-box h3 {\n                font-size: 24px;\n            }\n\n            .analysis-box ul,\n            .analysis-box p {\n                font-size: 16px;\n            }\n        }\n        &lt;/style&gt;\n\n        &lt;div class=\"analysis-wrapper\"&gt;\n\n            &lt;div class=\"analysis-title\"&gt;\ud83d\udd25 Cycle Segments&lt;/div&gt;\n\n            &lt;div class=\"analysis-subtitle\"&gt;\n                This heatmap divides each Bitcoin halving cycle into\n                &lt;strong&gt;16 equal block segments&lt;/strong&gt;\n                and shows the return in each segment. The goal is to see whether\n                Bitcoin returns are random, or whether they follow a repeating cycle structure.\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-grid\"&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\ud83d\udcca What is shown?&lt;/h3&gt;\n                    &lt;ul&gt;\n                        &lt;li&gt;Each row represents one Bitcoin halving cycle.&lt;/li&gt;\n                        &lt;li&gt;Each column represents one equal block segment.&lt;/li&gt;\n                        &lt;li&gt;Green cells indicate positive returns.&lt;/li&gt;\n                        &lt;li&gt;Red cells indicate negative returns.&lt;/li&gt;\n                        &lt;li&gt;Darker colors indicate stronger moves.&lt;/li&gt;\n                        &lt;li&gt;Current block in cycle: &lt;strong&gt;137,595&lt;/strong&gt;.&lt;/li&gt;\n                    &lt;/ul&gt;\n                &lt;/div&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\ud83d\udd01 Evidence for a cycle&lt;/h3&gt;\n                    &lt;p&gt;\n                        If Bitcoin returns were completely random, the green and red cells\n                        would appear scattered without a clear structure.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        Instead, the heatmap shows that similar parts of different cycles\n                        often behave in similar ways. This repeating structure is visual\n                        evidence that Bitcoin has followed a cycle tied to the halving period.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\ud83d\udcc8 Upward and downward phases&lt;/h3&gt;\n                    &lt;p&gt;\n                        The heatmap shows that Bitcoin cycles are not symmetric.\n                        Historically, much of the cycle is positive, while the correction\n                        phase is shorter and more concentrated.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        A typical pattern is a long upward phase followed by a shorter\n                        downward phase. This matches the idea that Bitcoin often rises for\n                        several segments and then corrects sharply.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n            &lt;/div&gt;\n\n            &lt;div class=\"analysis-grid\" style=\"margin-top: 24px;\"&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\u26cf Why the upward phase?&lt;/h3&gt;\n                    &lt;p&gt;\n                        Every 210,000 blocks, the mining reward is cut in half.\n                        This reduces the amount of newly created Bitcoin entering the market.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        If demand remains strong, this reduction in new supply creates\n                        upward pressure on price. The repeated green regions in the heatmap\n                        are consistent with this halving-driven supply effect.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\u26a1 Why the correction?&lt;/h3&gt;\n                    &lt;p&gt;\n                        As Bitcoin price rises, mining becomes more profitable.\n                        This attracts additional miners and increases spending on electricity,\n                        hardware, cooling and infrastructure.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        Eventually mining costs can become extremely large. When these costs\n                        become difficult to sustain, they may contribute to the end of the\n                        upward phase and the beginning of the correction phase.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n                &lt;div class=\"analysis-box\"&gt;\n                    &lt;h3&gt;\ud83c\udfaf Main observation&lt;/h3&gt;\n                    &lt;p&gt;\n                        The important point is not one single cell, but the repeated pattern\n                        across cycles.\n                    &lt;/p&gt;\n                    &lt;p&gt;\n                        The heatmap suggests that Bitcoin's strongest returns tend to cluster\n                        in similar parts of the halving cycle, while negative returns also\n                        tend to appear in similar parts of the cycle.\n                    &lt;/p&gt;\n                &lt;/div&gt;\n\n            &lt;/div&gt;\n\n            &lt;div class=\"footer-note\"&gt;\n                &lt;strong&gt;Main takeaway:&lt;/strong&gt;\n                Across multiple halving periods, Bitcoin cycles show a surprisingly similar\n                internal structure. Positive and negative returns are not evenly scattered;\n                they tend to cluster in recurring parts of the 210,000 block cycle.\n                This supports the view that Bitcoin's long-term behavior is influenced by\n                the halving schedule and by the economic interaction between reduced supply\n                and rising mining costs.\n                &lt;br&gt;&lt;br&gt;\n                This chart is for educational purposes only and is not financial advice.\n            &lt;/div&gt;\n\n        \n        &lt;style&gt;\n        .figure-share {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            gap: 14px;\n            margin: 28px auto 0 auto;\n            padding-top: 22px;\n            border-top: 1px solid rgba(255, 255, 255, 0.14);\n        }\n\n        .figure-share a {\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            width: 34px;\n            height: 34px;\n            border-radius: 50%;\n            color: white;\n            text-decoration: none;\n            transition: 0.2s;\n        }\n\n        .figure-share a:hover {\n            transform: scale(1.12);\n        }\n\n        .figure-share svg {\n            width: 18px;\n            height: 18px;\n            fill: currentColor;\n        }\n\n        .figure-share .x {\n            background: #1da1f2;\n        }\n\n        .figure-share .facebook {\n            background: #4b65a2;\n        }\n\n        .figure-share .email {\n            background: #7a7a7a;\n        }\n\n        .figure-share .whatsapp {\n            background: #25d366;\n        }\n        &lt;/style&gt;\n\n        &lt;div class=\"figure-share\" aria-label=\"Share The Cycle of Bitcoin\"&gt;\n            &lt;a\n                class=\"x\"\n                href=\"https://cycbtc.com\"\n                onclick=\"const pageUrl=(document.querySelector(&amp;quot;meta[property='og:url']&amp;quot;)||{}).content||window.location.href; const title=(document.querySelector(&amp;quot;meta[property='og:title']&amp;quot;)||{}).content||'The Cycle of Bitcoin'; const imageUrl=(document.querySelector(&amp;quot;meta[property='og:image']&amp;quot;)||{}).content||''; const message=imageUrl ? title + '\nFigure: ' + imageUrl + '\nWebsite: ' + pageUrl : title + '\n' + pageUrl; window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(message), '_blank', 'noopener,noreferrer'); return false;\"\n                target=\"_blank\"\n                rel=\"noopener noreferrer\"\n                aria-label=\"Share on X\"\n                title=\"Share on X\"\n            &gt;\n                &lt;svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"&gt;\n                    &lt;path d=\"M17.5 3h3.1l-6.8 7.8L22 21h-6.4l-5-6.5L4.9 21H1.8l7.3-8.4L1.2 3h6.6l4.5 5.9L17.5 3Zm-1.1 16.2h1.7L6.9 4.7H5.1l11.3 14.5Z\"/&gt;\n                &lt;/svg&gt;\n            &lt;/a&gt;\n\n            &lt;a\n                class=\"facebook\"\n                href=\"https://cycbtc.com\"\n                onclick=\"const pageUrl=(document.querySelector(&amp;quot;meta[property='og:url']&amp;quot;)||{}).content||window.location.href; window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(pageUrl), '_blank', 'noopener,noreferrer'); return false;\"\n
